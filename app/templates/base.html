<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}隨食隨地{% endblock %}</title>
    <!-- 預留引入靜態 CSS 的位置 -->
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> -->
</head>
<body>
    <nav>
        <!-- 導覽列 -->
        <a href="{{ url_for('ingredient.index') }}">我的材料庫</a>
        <a href="{{ url_for('recipe.recommend') }}">找靈感 (推薦食譜)</a>
    </nav>

    <main>
        <!-- 顯示 Flash 提示訊息 -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <!-- 各頁面主體內容 -->
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 隨食隨地</p>
    </footer>
</body>
</html>
