{% extends 'base.html' %}
{% block title %}新增食材 - 隨食隨地{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-6 col-lg-5">
        <div class="card glass-card p-4 p-md-5">
            <h2 class="section-title mb-4 text-center">新增食材</h2>
            <form action="{{ url_for('ingredient.create_ingredient') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label text-light-muted">食材名稱 *</label>
                    <input type="text" class="form-control custom-input" id="name" name="name" required placeholder="例如：番茄">
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label for="quantity" class="form-label text-light-muted">數量 *</label>
                        <input type="number" step="0.1" class="form-control custom-input" id="quantity" name="quantity" required placeholder="例如：2">
                    </div>
                    <div class="col-6 mb-3">
                        <label for="unit" class="form-label text-light-muted">單位 *</label>
                        <input type="text" class="form-control custom-input" id="unit" name="unit" required placeholder="例如：顆">
                    </div>
                </div>
                <div class="mb-5">
                    <label for="expiry_date" class="form-label text-light-muted">有效期限 (選填)</label>
                    <input type="date" class="form-control custom-input" id="expiry_date" name="expiry_date">
                </div>
                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-primary btn-gradient rounded-pill py-2">儲存食材</button>
                    <a href="{{ url_for('ingredient.list_ingredients') }}" class="btn btn-link text-muted text-decoration-none text-center">返回列表</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
