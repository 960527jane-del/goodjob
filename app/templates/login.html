{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="auth-card card shadow border-0 p-4">
            <div class="text-center mb-4">
                <div class="auth-icon mb-3">👨‍🍳</div>
                <h2 class="fw-bold text-dark">歡迎回來</h2>
                <p class="text-muted">登入以繼續你的烹飪冒險</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">
                        <i class="fas fa-envelope me-1 text-primary"></i>Email
                    </label>
                    <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email"
                           value="{{ email|default('') }}" placeholder="you@example.com" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">
                        <i class="fas fa-lock me-1 text-primary"></i>密碼
                    </label>
                    <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password"
                           placeholder="輸入你的密碼" required>
                </div>

                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember" name="remember">
                    <label class="form-check-label text-muted" for="remember">記住我</label>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                    <i class="fas fa-sign-in-alt me-2"></i>登入
                </button>
            </form>

            <div class="text-center mt-2">
                <p class="text-muted mb-0">
                    還沒有帳號？
                    <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">立即註冊</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
