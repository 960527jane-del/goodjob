{% extends 'base.html' %}

{% block content %}
<div class="row mb-5 mt-3">
    <div class="col text-center">
        <h1 class="display-5 fw-bold text-primary mb-3">食譜大廳</h1>
        <p class="lead text-muted">探索美味食譜，動手做做看，解鎖可愛的成就吧！</p>
    </div>
</div>

<div class="row row-cols-1 row-cols-md-3 g-4 mb-5">
    {% for recipe in recipes %}
    <div class="col">
        <div class="card h-100 recipe-card shadow-sm border-0">
            <img src="{{ recipe.image_url }}" class="card-img-top" alt="{{ recipe.title }}" style="height: 200px; object-fit: cover;">
            <div class="card-body p-4">
                <h5 class="card-title fw-bold text-dark">{{ recipe.title }}</h5>
                <p class="card-text text-muted">{{ recipe.description }}</p>
            </div>
            <div class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center p-4 pt-0">
                
                {% if recipe.id in collections %}
                <form action="{{ url_for('remove_collection', recipe_id=recipe.id) }}" method="POST" class="d-inline m-0">
                    <button type="submit" class="btn btn-danger btn-sm px-3 rounded-pill shadow-sm"><i class="fas fa-heart"></i> 已收藏</button>
                </form>
                {% else %}
                <form action="{{ url_for('add_collection', recipe_id=recipe.id) }}" method="POST" class="d-inline m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm px-3 rounded-pill"><i class="far fa-heart"></i> 收藏</button>
                </form>
                {% endif %}

                <form action="{{ url_for('cook_recipe', recipe_id=recipe.id) }}" method="POST" class="d-inline m-0">
                    <button type="submit" class="btn btn-warning btn-sm text-dark fw-bold px-3 rounded-pill shadow-sm"><i class="fas fa-fire text-danger"></i> 試做</button>
                </form>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
